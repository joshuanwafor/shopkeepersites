version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Amplify build image doesn't include pnpm; install it globally
        - npm install -g pnpm@9
        - pnpm install --frozen-lockfile
    build:
      commands:
        - pnpm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
